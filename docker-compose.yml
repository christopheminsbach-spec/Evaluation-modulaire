services:

  web:
    build: .

    container_name: hyrule_web

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn hyrule.wsgi:application --bind 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    restart: unless-stopped